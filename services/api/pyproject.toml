[build-system]
requires = ["setuptools>=80.0"]
build-backend = "setuptools.build_meta"

[project]
name = "afterhours-api"
version = "0.1.0"
description = "FastAPI runtime for routing, scoring, and report workflows."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "alembic==1.16.5",
  "fastapi==0.128.8",
  "geoalchemy2[shapely]==0.17.1",
  "httpx==0.28.1",
  "pydantic-settings==2.11.0",
  "psycopg[binary]==3.2.13",
  "redis==7.0.1",
  "sqlalchemy==2.0.48",
  "uvicorn[standard]==0.39.0",
]

[project.optional-dependencies]
dev = [
  "mypy==1.19.1",
  "pytest==8.4.2",
  "pytest-asyncio==1.2.0",
  "ruff==0.15.5",
]

[project.scripts]
afterhours-api = "app.main:serve"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"