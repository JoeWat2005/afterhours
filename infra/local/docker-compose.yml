services:
  postgres:
    image: postgis/postgis:17-3.5
    container_name: afterhours-postgres
    environment:
      POSTGRES_DB: afterhours
      POSTGRES_USER: afterhours
      POSTGRES_PASSWORD: afterhours
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:8.2-alpine
    container_name: afterhours-redis
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data:
